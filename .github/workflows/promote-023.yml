name: Publish qualified signed Mammoth 0.1.23 update
on:
  push:
    branches: [delivery/0.1.23]
    paths: [.github/workflows/promote-023.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require exact successful native qualification and unchanged signing identity
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = iliketoeatalot/mammoth-releases
          test "$GITHUB_REF" = refs/heads/delivery/0.1.23
          test "$(sha256sum payload-023/delivery-qualification.json | cut -d' ' -f1)" = c0c281d219ea0c3f54cafe8d3680250ee1efa9baf69f86430f9108809f2195c4
          cd payload-023
          sha256sum -c SHA256SUMS
          node <<'JS'
          const fs=require('fs'),crypto=require('crypto');
          const q=JSON.parse(fs.readFileSync('delivery-qualification.json'));
          const c=JSON.parse(fs.readFileSync('release-candidate.json'));
          const hash=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const requireValue=(actual,expected)=>{if(actual!==expected)throw Error('Qualification identity mismatch');};
          for(const [key,value] of Object.entries({kind:'native-delivery-qualification',version:'0.1.23',platform:'Windows',synthetic:false,outcome:'PASS',staging_qualified:true,run_id:'37714292767',source_commit:'641234f9b6edff19a84dc57fa534c779a88a8f03',candidate_sha256:'eaeaac9a9097f747a35faa1104bd870c81cc66ed05de75c2847b3877b0915e2c',installer_sha256:'ca8122f31d5e748002de9e48678aa4db06ac5363be627182f1df342c4d1c9c42',executable_sha256:'64f5a9b4773bea702da032a0c5180122b22a36a5922d6664c8e4f7a4921a411e'}))requireValue(q[key],value);
          requireValue(c.version,'0.1.23');requireValue(c.repository,'iliketoeatalot/mammoth-releases');
          requireValue(c.channel.publicKey,'9ZVdGgUQFyHQduXuBOfzCxV/2uiIMIu+XYZOjWdmZOk=');
          requireValue(c.channel.feed,'https://github.com/iliketoeatalot/mammoth-releases/releases/latest/download/appcast.xml');
          requireValue(hash('release-candidate.json'),q.candidate_sha256);
          requireValue(hash('Mammoth-Setup-0.1.23.exe'),q.installer_sha256);
          const key=crypto.createPublicKey({key:Buffer.concat([Buffer.from('302a300506032b6570032100','hex'),Buffer.from(c.channel.publicKey,'base64')]),format:'der',type:'spki'});
          if(!crypto.verify(null,fs.readFileSync('Mammoth-Setup-0.1.23.exe'),key,Buffer.from(fs.readFileSync('signature.txt','utf8').trim(),'base64')))throw Error('Invalid shipping signature');
          console.log('PASS exact qualified signed shipping bytes');
          JS
      - name: Read back staging and preserve prior normal feed until promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" = v0.1.22
          gh release download v0.1.22 --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir previous-feed
          test "$(sha256sum previous-feed/appcast.xml | cut -d' ' -f1)" = ac56894ada3540d1d342ad10435bfa25100b7e2887bca01f9197c6f772bd8ed5
          gh release upload v0.1.23-staging payload-023/delivery-qualification.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release download v0.1.23-staging --repo "$GITHUB_REPOSITORY" --dir staging-readback
          (cd staging-readback && sha256sum -c SHA256SUMS)
      - name: Upload draft and verify exact uploaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.1.23 payload-023/Mammoth-Setup-0.1.23.exe payload-023/Mammoth-Windows.zip payload-023/appcast.xml payload-023/release-candidate.json payload-023/signature.txt payload-023/SHA256SUMS payload-023/release-notes.md payload-023/delivery-qualification.json payload-023/build-provenance.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Mammoth 0.1.23" --notes-file payload-023/release-notes.md --draft --latest=false
          gh release download v0.1.23 --repo "$GITHUB_REPOSITORY" --dir draft-readback
          (cd draft-readback && sha256sum -c SHA256SUMS)
          cmp payload-023/delivery-qualification.json draft-readback/delivery-qualification.json
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" = v0.1.22
      - name: Promote and verify live updater feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v0.1.23 --repo "$GITHUB_REPOSITORY" --draft=false --latest=true
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" = v0.1.23
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 3 https://github.com/iliketoeatalot/mammoth-releases/releases/latest/download/appcast.xml --output live-appcast.xml
          cmp payload-023/appcast.xml live-appcast.xml
          echo 'PASS signed qualified 0.1.23 published and normal feed read back'
