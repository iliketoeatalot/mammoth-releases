name: Stage signed Mammoth 0.1.18
on:
  push:
    branches: [release/staging-0.1.18]
    paths: [.github/workflows/stage-018.yml]
permissions:
  contents: write
concurrency:
  group: mammoth-stage-018
  cancel-in-progress: false
jobs:
  stage:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Retrieve and verify the exact tested build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-f9d4-81f5-b3ec-49ec6c4dfca6/raw?se=2026-10-06T18%3A47%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=dde561e8-ecc4-49b9-9d78-f98f2dd750c0&skoid=80e81ea6-3c08-46f9-bd84-b87176742bcd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T02%3A05%3A30Z&ske=2026-10-07T02%3A05%3A30Z&sks=b&skv=2026-02-06&sig=apnz1sXCbuoulsYCity6PSyFdWMFuewrUG9QjwYOPPk%3D' -OutFile native.zip -TimeoutSec 120
          if ((Get-FileHash native.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '1374a731f05f6ecdb853dd9452f0dfc61eda22c204a9b5e0c01fb8a3c35476df') { throw 'CI archive mismatch' }
          Expand-Archive native.zip native
          $installer = 'native/dist/Mammoth-Setup-0.1.18.exe'
          $portable = 'native/dist/Mammoth-Windows.zip'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a4b7950213bafe29c36d5868cc14444f1161bb851600062a2790a5a283ba5288') { throw 'Installer mismatch' }
          if ((Get-FileHash $portable -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'cc849de0db4cd1fde67c3b06c7cb9b19dc61d17c9b0b02fb517ff35c90c546c1') { throw 'Portable mismatch' }
          [IO.File]::WriteAllBytes('signature.txt',[Convert]::FromBase64String('ZlhCRUlta0thV3g2dWRwaUl0am51STVZL0lGd200cUE5b3M2OHJCQ1ZSVTQ1MmQ3TkNodFZIaUxnamNtN2Q0QUM1SGZseTRtVVFOaDgwMTUxM2dLRGc9PQo='))
          Invoke-WebRequest -Uri 'https://github.com/vslavik/winsparkle/releases/download/v0.9.4/WinSparkle-0.9.4.zip' -OutFile verifier.zip -TimeoutSec 90
          if ((Get-FileHash verifier.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6037df37fc263bd1650a1c4949681a9d40ffe991d01f35892a406cb5d103c976') { throw 'Verifier archive mismatch' }
          Expand-Archive verifier.zip verifier
          $tools = @(Get-ChildItem verifier -Recurse -Filter winsparkle-tool.exe)
          if ($tools.Count -ne 1) { throw 'Expected one official verifier' }
          & $tools[0].FullName verify --public-key '9ZVdGgUQFyHQduXuBOfzCxV/2uiIMIu+XYZOjWdmZOk=' --signature 'fXBEImkKaWx6udpiItjnuI5Y/IFwm4qA9os68rBCVRU452d7NChtVHiLgjcm7d4AC5Hfly4mUQNh801513gKDg==' $installer
          if ($LASTEXITCODE -ne 0) { throw 'Official signature verification failed' }
          [IO.File]::WriteAllBytes('appcast.xml',[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes('appcast-staging.xml',[Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes('release-candidate.json',[Convert]::FromBase64String(''))
      - name: Publish prerelease assets without changing the stable updater
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & gh release view v0.1.18-staging --repo iliketoeatalot/mammoth-releases 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Staging already exists; do not overwrite immutable candidate' }
          & gh release create v0.1.18-staging native/dist/Mammoth-Setup-0.1.18.exe native/dist/Mammoth-Windows.zip signature.txt appcast.xml appcast-staging.xml release-candidate.json --repo iliketoeatalot/mammoth-releases --prerelease --latest=false --title 'Mammoth 0.1.18 upgrade testing' --notes 'Signed exact CI candidate. Upgrade qualification pending; stable updater remains on 0.1.17.'
          if ($LASTEXITCODE -ne 0) { throw 'Staging publication failed' }
          & gh release view --repo iliketoeatalot/mammoth-releases --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read stable version' }
